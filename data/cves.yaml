# =============================================================================
# ReproBench dataset -- paper Table 3 (30 CVEs, 10 per vulnerability class)
# =============================================================================
# This file is the released evaluation set. It is a transcription of Table 3 of
# "ReproBench: Benchmarking LLM Agents on Reproducing Vulnerability From
# Scratch". Nothing here may be recomputed at runtime: the 30 entries ARE the
# benchmark. The 696-item candidate pool (NVD mining -> filters F1/F2/F3 ->
# stratified top-10 per class) is NOT released with the artifact; re-running
# `reprobench mine` + `reprobench select` regenerates a pool and writes
# data/candidates/selection_log.jsonl, but the pinned evaluation set is the one
# below.
#
# Schema (per entry):
#   id                       CVE identifier (unique, uppercase)
#   class                    BOF | CMDI | AUTH  (exactly one, filter F3)
#   vendor                   canonical vendor name (see vendor_gazetteer.txt)
#   products                 list of affected product/model names (Table 3)
#   year                     publication year (2020..2026)
#   cwe                      list[int] CWE ids; must be a subset of the class set
#   trigger_evidence_type    expected observable (config/trigger_evidence.yaml)
#   advisory_url             canonical advisory / NVD record (provenance only)
#   sources_hint             free-text list of the >=2 independent sources used by
#                            filter F2 during selection (advisory, CNA, vendor,
#                            GitHub PoC, ExploitDB/PacketStorm, blog, commit)
#   firmware_hint            vendor/model firmware family that must be acquired in
#                            P2 (no URL is pinned here -- F1 reachability is
#                            established during profile building, and pinned
#                            mirrors live in data/profiles/<CVE>/sources/*)
#   notes                    free text
# =============================================================================

version: "1.0"
schema_version: 1
table: "Table 3"
paper_section: "4.1 Dataset construction / Table 3"
source: "ReproBench paper, Table 3 (transcribed)"
released: true
candidate_pool_released: false

# -----------------------------------------------------------------------------
# Evaluation-set invariants (asserted by tests/test_dataset.py and by
# `reprobench verify --dataset`). Do not edit without bumping schema_version.
# -----------------------------------------------------------------------------
expected:
  total: 30
  per_class:
    BOF: 10
    CMDI: 10
    AUTH: 10
  vendors: 14
  year_min: 2020
  year_max: 2026
  trials: 3
  models: 5
  total_runs: 450   # 30 CVEs x 5 models x 3 trials

# -----------------------------------------------------------------------------
# Class definitions (filter F3: a CVE's CWE set must map to EXACTLY one class).
# Mirrors config/phases.yaml `classes:` and config/trigger_evidence.yaml
# `class_requirements:`.
# -----------------------------------------------------------------------------
classes:
  BOF:
    label: "Buffer overflow"
    cwe: [120, 121, 122]
    trigger_evidence_type: crash
  CMDI:
    label: "Command injection"
    cwe: [77, 78]
    trigger_evidence_type: command_output
  AUTH:
    label: "Authentication bypass"
    cwe: [287, 288, 306, 284, 912, 798]
    trigger_evidence_type: auth_bypass

# -----------------------------------------------------------------------------
# Selection procedure metadata (paper Sec. 4.1). `reprobench mine --offline`
# replays the procedure against data/candidate_pool.jsonl.
# -----------------------------------------------------------------------------
selection:
  miner: "NVD 2.0 API (cvehistory/CVE API), CWE filter + pubStartDate/pubEndDate"
  pagination:
    results_per_page: 2000
    start_index: 0
  enrichments:
    - cve_services        # CVE Services API (CNA-supplied records)
    - cisa_kev            # known-exploited-vulnerability catalogue
    - github_poc          # GitHub code search for PoC repositories
    - exploitdb_packetstorm
  filters:
    F1:
      id: F1
      name: firmware_reachable
      description: >-
        A firmware image URL is reachable or a known mirror exists for the affected
        vendor/product/version. Unreachable-and-unmirrored products are rejected.
    F2:
      id: F2
      name: evidence_density
      description: >-
        At least 2 independent evidence sources, at least one of which names a
        concrete endpoint, parameter, or binary path.
      min_independent_sources: 2
      require_concrete_artifact: true
    F3:
      id: F3
      name: single_class_cwe
      description: >-
        The CVE's CWE set maps to exactly one of {BOF, CMDI, AUTH}. Mixed-class or
        unclassifiable CVEs are rejected.
      mapping:
        BOF: [120, 121, 122]
        CMDI: [77, 78]
        AUTH: [287, 288, 306, 284, 912, 798]
  stratification:
    per_class: 10
    order: "publication year desc, then vendor diversity, then evidence density"
  selection_log: "data/candidates/selection_log.jsonl"
  candidate_pool: "data/candidate_pool.jsonl"

