notes:
  - "Table 3 lists 30 CVEs, 10 per class (BOF/CMDI/AUTH) and 14 vendors spanning 2020-2026; the derived block encodes the same counts so a YAML-only cross-check can catch transcription drift."
  - "CWE sets follow filter F3 exactly: BOF={120,121,122}, CMDI={77,78}, AUTH={287,288,306,284,912,798}. Each entry's cwe list is a non-empty subset of its class set."
  - "trigger_evidence_type is class-derived (config/trigger_evidence.yaml class_requirements) and is what P6.3 credit is measured against; it is advisory for the agent and is never shown to it."
  - "No firmware URL is pinned in this file. Filter F1 (reachable image / known mirror) is evaluated during profile building; resolved URLs and sha256 digests live in data/profiles/<CVE>/sources/* and profile.json."
  - "sources_hint records the source families that satisfied filter F2 at selection time; profile/verify.py re-checks concrete_trigger_evidence_verified against the fetched corpus and may mark a CVE incomplete/manual_review."
  - "The 696-item candidate pool is not released; re-running the miner produces a fresh pool and a selection_log.jsonl, and the 30 ids above are then pinned by hand."
