# ReproBench packaging metadata.
#
# Install (development):
#   pip install -e .
#   pip install -e ".[live]"     # optional OpenAI/Anthropic judge SDKs
#
# The console entry point is `reprobench = reprobench.cli:main`, matching
# README section "CLI" and the scripts under scripts/.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reprobench"
version = "1.0.0"
description = "ReproBench: CVE-only IoT firmware vulnerability reproduction benchmark (measurement instrument)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ReproBench Authors" }]
keywords = [
    "benchmark",
    "llm-agents",
    "vulnerability-reproduction",
    "iot-firmware",
    "cve",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0.1",
    "Jinja2>=3.1.3",
    "httpx>=0.27",
    "tenacity>=8.2.3",
    "python-magic>=0.4.27",
    "pyelftools>=0.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pytest>=8.1",
    "pytest-cov>=5.0",
]

[project.optional-dependencies]
# Judge / agent SDKs are NOT installed by default: the offline self-test and the
# heuristic judge must run with only the core stack above.
live = [
    "openai>=1.30",
    "anthropic>=0.25",
]
dev = [
    "openai>=1.30",
    "anthropic>=0.25",
    "pytest>=8.1",
    "pytest-cov>=5.0",
]

[project.scripts]
reprobench = "reprobench.cli:main"

[project.urls]
Homepage = "https://example.invalid/reprobench"
Paper = "https://example.invalid/reprobench/paper"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["reprobench*"]

[tool.setuptools.package-data]
reprobench = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/reprobench"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
